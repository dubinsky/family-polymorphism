plugins {
  id 'scala'
  id 'org.podval.conventions'
}

// Gradle 9.8.1 still defaults Zinc to 1.12.0.
scala.zincVersion = '1.12.1'

group = 'org.podval.families'
description = 'Family Polymorphism in Scala'
version = '0.1'

dependencies {
  // Note: 7.3.0 disabled retrieval of the DTDs over HTTP:
  testImplementation 'org.testng:testng:7.12.0'
}
